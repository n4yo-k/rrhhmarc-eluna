services:
  database:
    image: postgres:16-alpine
    container_name: rrhh_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - rrhh_pgdata:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - rrhhnet
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  api:
    build: ./api
    container_name: rrhh_api
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${HOST_API_PORT}:${INTERNAL_API_PORT}"
    depends_on:
      database:
        condition: service_healthy
    networks:
      - rrhhnet

  web:
    build: ./web
    container_name: rrhh_web
    restart: unless-stopped
    ports:
      - "${WEB_PORT}:80"
    depends_on:
      - api
    networks:
      - rrhhnet

volumes:
  rrhh_pgdata:

networks:
  rrhhnet:
    driver: bridge
